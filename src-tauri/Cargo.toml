[package]
name = "labreport-studio"
version = "0.1.0"
description = "実験レポート統括ソフト"
edition = "2021"

[lib]
name = "labreport_lib"
path = "src/lib.rs"

[[bin]]
name = "labreport-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
